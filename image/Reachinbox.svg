<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glossy Background Gradient -->
    <linearGradient id="bg-gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2228" />
      <stop offset="40%" stop-color="#0B0C0E" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>

    <!-- Metallic Edge Bevel -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#333740" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- White Metallic Monogram Gradient -->
    <linearGradient id="monogram-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E1E4E8" />
      <stop offset="70%" stop-color="#9FA4AD" />
      <stop offset="100%" stop-color="#5B6069" />
    </linearGradient>

    <!-- Inner Shadow & Facet Overlay Gradients -->
    <linearGradient id="facet-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="facet-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>

    <!-- Gold Accent Gradient for Subtitle Text -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7836" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="monogram-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.2" />
    </filter>

    <!-- Glass Reflection Filter -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-gloss)" filter="url(#monogram-shadow)" />
  <rect x="33" y="33" width="446" height="446" rx="95" fill="none" stroke="url(#border-glow)" stroke-width="2" />

  <!-- Glass Surface Highlight Corner -->
  <path d="M 32 128 C 32 75 75 32 128 32 L 384 32 C 437 32 480 75 480 128 L 480 180 L 32 300 Z" fill="url(#glass-glare)" />

  <!-- 3D Monogram Logo "Ri" -->
  <g filter="url(#monogram-shadow)" transform="translate(0, -18)">
    
    <!-- Winged "R" Ribbon Body -->
    <!-- Base Fill -->
    <path d="M 170 140 
             C 210 140, 275 145, 275 190 
             C 275 220, 245 235, 220 240 
             C 250 255, 290 285, 295 325 
             C 270 325, 240 310, 215 280 
             C 195 255, 185 248, 175 248 
             L 175 315 
             C 175 325, 140 325, 140 315 
             L 140 165 
             C 140 148, 152 140, 170 140 Z 
             M 175 170 
             L 175 220 
             C 195 220, 235 218, 235 195 
             C 235 172, 195 170, 175 170 Z" 
          fill="url(#monogram-silver)" />

    <!-- Upper Wing Feathers Flare (Top Left Feathering) -->
    <path d="M 140 180 
             C 115 170, 95 140, 110 125 
             C 135 110, 185 130, 210 140 
             C 180 140, 155 155, 140 180 Z" 
          fill="url(#monogram-silver)" />

    <path d="M 125 210 
             C 105 200, 85 180, 95 165 
             C 115 150, 145 165, 165 175 
             C 145 175, 135 190, 125 210 Z" 
          fill="url(#facet-highlight)" />

    <!-- 3D Depth Facets & Shadows on "R" Curve -->
    <path d="M 170 140 
             C 210 140, 275 145, 275 190 
             C 275 220, 245 235, 220 240 
             C 195 220, 175 220, 175 170 
             Z" 
          fill="url(#facet-shadow)" opacity="0.35" />

    <!-- "i" Lower Curve & Dot -->
    <!-- "i" Stem Ribbon -->
    <path d="M 320 220 
             C 340 220, 355 240, 350 270 
             C 345 300, 325 325, 295 325 
             C 310 305, 320 280, 320 255 
             C 320 235, 312 225, 305 220 
             Z" 
          fill="url(#monogram-silver)" />

    <!-- "i" Metallic Dot -->
    <circle cx="340" cy="165" r="22" fill="url(#monogram-silver)" />
    <circle cx="334" cy="159" r="18" fill="url(#facet-highlight)" opacity="0.7" />

    <!-- Specular Highlight Edges -->
    <path d="M 170 142 C 210 142, 273 147, 273 190" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
    <path d="M 140 165 L 140 315" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
  </g>

  <!-- "ReachInbox" Text -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="0.5" 
        fill="url(#gold-text)">Reach<tspan font-weight="700">Inbox</tspan></text>
</svg>
